<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生日快乐！</title>
    <style>
        /* 全局基础样式 */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Microsoft YaHei', sans-serif;
            transition: background-color 0.8s ease, color 0.8s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            padding: 20px;
        }

        /* 浅色模式（派大星主题） */
        body.light {
            background-color: #FCA3B7; /* 派大星的粉色 */
            color: #8D51A0; /* 派大星裤子上的紫色花朵颜色 */
        }

        /* 深色模式（信件环境） */
        body.dark {
            background-color: #1a1a2e;
            color: #e0e0e0;
        }

        /* 右上角图标按钮（极简、不明显） */
        #theme-toggle {
            position: fixed;
            top: 25px;
            right: 25px;
            width: 22px;
            height: 22px;
            opacity: 0.12; /* 调低透明度，非常隐蔽 */
            cursor: pointer;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 1000;
        }
        
        #theme-toggle:hover {
            opacity: 0.7;
            transform: scale(1.1);
        }

        /* 派大星祝福卡片（浅色模式显示） */
        #light-content {
            background-color: rgba(255, 255, 255, 0.4);
            border: 6px solid #B5D238; /* 派大星裤子的绿色 */
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            max-width: 500px;
            width: 100%;
            transition: all 0.5s ease;
        }
        
        #light-content h1 {
            font-size: 2.3em;
            margin-top: 0;
            margin-bottom: 15px;
        }

        /* 信件内容包裹器（深色模式显示） */
        #dark-content {
            display: none;
            background-color: #fdf6e3; /* 复古信纸颜色 */
            color: #2c2c2c;
            padding: 40px 50px;
            border-radius: 4px;
            max-width: 600px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto; /* 如果信太长可以滚动 */
            box-shadow: inset 0 0 30px rgba(0,0,0,0.05), 0 12px 45px rgba(0,0,0,0.4);
            line-height: 1.8;
            font-family: 'Kaiti', 'STKaiti', 'Microsoft YaHei', serif;
            position: relative;
            animation: fadeIn 1s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 弹窗样式 */
        #modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        #modal-box {
            background: white;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            color: #333;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            border: 3px solid #FCA3B7;
            max-width: 90%;
            width: 350px;
        }

        #modal-box h3 {
            margin-top: 0;
            color: #8D51A0;
        }

        #modal-box input {
            padding: 12px;
            margin: 15px 0;
            width: 100%;
            border: 2px solid #eee;
            border-radius: 8px;
            outline: none;
            text-align: center;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        #modal-box input:focus {
            border-color: #FCA3B7;
        }

        #modal-box .btn-group {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        #modal-box button {
            flex: 1;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95em;
            transition: background 0.2s;
        }

        #modal-box .btn-confirm {
            background-color: #FCA3B7;
            color: white;
        }

        #modal-box .btn-confirm:hover {
            background-color: #f5849e;
        }

        #modal-box .btn-cancel {
            background-color: #f0f0f0;
            color: #555;
        }

        #modal-box .btn-cancel:hover {
            background-color: #e2e2e2;
        }
    </style>
</head>
<body class="light">

    <div id="theme-toggle" onclick="handleToggleClick()">
        <svg id="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
    </div>

    <div id="modal-overlay">
        <div id="modal-box">
            <h3>🔒 解锁秘密信件</h3>
            <p style="color: #666; margin: 5px 0 15px 0;">海绵宝宝最好的朋友是谁？</p>
            <input type="text" id="answer-input" placeholder="输入答案后回车..." onkeydown="if(event.key==='Enter') checkAnswer()">
            <div class="btn-group">
                <button class="btn-cancel" onclick="closeModal()">取消</button>
                <button class="btn-confirm" onclick="checkAnswer()">确认</button>
            </div>
        </div>
    </div>

    <div id="light-content">
        <h1>🌟 生日快乐！ 🌟</h1>
        <p style="font-size: 1.15em; line-height: 1.6;">愿你像派大星一样，永远无忧无虑，天天开心！</p>
        <div style="font-size: 3em; margin: 25px 0;">
            ⭐ 🩳 🍔
        </div>
        <p style="font-size: 0.85em; opacity: 0.6; margin-top: 20px;">（仔细看，页面里好像藏着一个小秘密哦）</p>
    </div>

    <div id="dark-content"></div>

    <script>
        // 简笔画太阳与弯月的 SVG 图标代码
        const sunSVG = `
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>`;

        const moonSVG = `
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>`;

        function handleToggleClick() {
            if (document.body.classList.contains('light')) {
                document.getElementById('modal-overlay').style.display = 'flex';
                document.getElementById('answer-input').focus();
            } else {
                switchToLight();
            }
        }

        function checkAnswer() {
            const answer = document.getElementById('answer-input').value.trim();
            // 这里设置正确答案，只要包含“派大星”三个字就判定正确
            if (answer.includes('派大星')) {
                closeModal();
                switchToDark();
                document.getElementById('answer-input').value = ''; 
            } else {
                alert('不对哦！再想想？(提示：粉红色的海星)');
            }
        }

        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
        }

        // 利用 Fetch API 动态抓取同目录下的外部 letter.txt 文件
        function switchToDark() {
            fetch('letter.txt')
                .then(response => {
                    if (!response.ok) throw new Error('未找到信件文件');
                    return response.text();
                })
                .then(text => {
                    // 将纯文本中的换行符转换为网页的换行标签 <br>
                    const formattedText = text.replace(/\n/g, '<br>');
                    
                    document.body.classList.remove('light');
                    document.body.classList.add('dark');
                    
                    document.getElementById('light-content').style.display = 'none';
                    
                    const darkContent = document.getElementById('dark-content');
                    darkContent.innerHTML = formattedText;
                    darkContent.style.display = 'block';
                    
                    document.getElementById('theme-toggle').innerHTML = moonSVG;
                })
                .catch(error => {
                    console.error('信件读取失败:', error);
                    alert('糟糕，信件在海底迷路了（请确保 letter.txt 存在并与网页在同一目录中）');
                });
        }

        function switchToLight() {
            document.body.classList.remove('dark');
            document.body.classList.add('light');
            
            document.getElementById('light-content').style.display = 'block';
            document.getElementById('dark-content').style.display = 'none';
            document.getElementById('theme-toggle').innerHTML = sunSVG;
        }
    </script>
</body>
</html>
