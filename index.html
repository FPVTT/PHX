<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎄◟(˶> ᎑ <˶)◞🎄</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'patrick-pink': '#FF9AA2',
                        'letter-bg': '#0f172a',
                        'letter-paper': '#1e293b',
                    },
                    fontFamily: {
                        'cute': ['Comic Sans MS', 'cursive', 'sans-serif'],
                        'letter': ['Georgia', 'serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            /* 核心动画 */
            .animate-character-dance { animation: characterDance 6s ease-in-out infinite; }
            .animate-bubble-float { animation: bubbleFloat 4s ease-in-out infinite; }
            .animate-gift-bounce { animation: giftBounce 2.2s ease-in-out infinite; }

            /* 流光渐变背景 */
            .gradient-bg {
                background: linear-gradient(-45deg, #FF9AA2, #FFB7B2, #FFDAC1, #E2F0CB, #B5EAD7);
                background-size: 400% 400%;
                animation: gradientShift 15s ease infinite;
            }
        }

        @keyframes characterDance {
            0%, 100% { transform: translateY(0px) scale(1) rotate(0deg); }
            33% { transform: translateY(-12px) scale(1.02) rotate(1.5deg); }
            66% { transform: translateY(6px) scale(0.98) rotate(-1.5deg); }
        }

        @keyframes bubbleFloat {
            0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.6; }
            50% { transform: translateY(-20px) translateX(10px); opacity: 0.9; }
        }

        @keyframes giftBounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-18px) scale(1.02); }
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body class="min-h-screen bg-transparent transition-all duration-700 font-cute overflow-x-hidden flex flex-col justify-between relative">

    <div id="gradient-layer" class="fixed inset-0 z-[-1] gradient-bg transition-opacity duration-700 opacity-100"></div>

    <div id="intro-overlay" class="fixed inset-0 z-[100] bg-cover bg-center bg-no-repeat flex flex-col items-center justify-center transition-opacity duration-1000 cursor-pointer p-4 select-none" style="background-image: url('gift-bg.png');">
        <div id="gift-wrapper" class="relative animate-gift-bounce transition-transform duration-300 hover:scale-105 max-w-xl md:max-w-2xl w-full flex justify-center">
            <img src="gift-box.png" alt="生日礼盒" class="w-full max-w-[380px] md:max-w-[500px] h-auto drop-shadow-[0_35px_50px_rgba(0,0,0,0.4)]">
        </div>
    </div>

    <audio id="bgm" loop preload="auto">
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <div id="bg-character-layer" class="absolute inset-0 z-0 pointer-events-none bg-contain bg-center bg-no-repeat transition-all duration-700 dark:opacity-10 animate-character-dance" style="background-image: url('background.png'); background-position: center 45%;">
    </div>

    <div class="absolute inset-0 z-10 pointer-events-none overflow-hidden select-none">
        <span class="absolute top-[20%] left-[15%] text-3xl animate-bubble-float">💧</span>
        <span class="absolute top-[15%] right-[20%] text-2xl animate-bubble-float" style="animation-delay: 1.5s;">🌟</span>
        <span class="absolute bottom-[30%] left-[25%] text-2xl animate-bubble-float" style="animation-delay: 0.7s;">🎈</span>
        <span class="absolute bottom-[40%] right-[15%] text-3xl animate-bubble-float" style="animation-delay: 2.2s;">✨</span>
    </div>

    <div id="patrick-hint" class="absolute z-20 text-patrick-pink text-xs md:text-sm font-bold bg-white/80 px-3 py-1.5 rounded-full shadow-sm pointer-events-none animate-bounce" style="top: 36%; left: 29%;">
        ↙戳一下↘
    </div>

    <button id="patrick-trigger" class="absolute z-20 cursor-pointer pointer-events-auto" style="width: 25%; height: 40%; top: 30%; left: 20%;" title="点击播放/暂停音乐"></button>
    
    <button id="cake-trigger" class="absolute z-20 cursor-pointer pointer-events-auto" style="width: 18%; height: 35%; top: 35%; left: 41%;" title="点击查看惊喜"></button>

    <button id="theme-toggle" class="fixed top-6 right-6 z-50 p-2 rounded-full opacity-30 hover:opacity-100 transition-all duration-300">
        <span id="theme-icon" class="text-gray-500 text-2xl font-bold">☼</span>
    </button>

    <div id="image-modal" class="fixed inset-0 bg-black/80 z-[110] hidden flex items-center justify-center p-4 backdrop-blur-sm transition-opacity duration-300">
        <div class="relative max-w-sm md:max-w-md w-full flex flex-col items-center gap-4 transform transition-all">
            <button id="close-image-modal" class="absolute -top-12 right-0 text-white/80 hover:text-white text-4xl font-bold transition-colors">&times;</button>
            
            <img src="surprise.png" alt="惊喜图片" class="w-full h-auto rounded-2xl shadow-2xl border-4 border-white/20">
            
            <a href="surprise.png" download="小蛋糕.png" class="w-full py-3.5 bg-patrick-pink hover:bg-pink-400 text-white rounded-xl transition-colors font-bold text-base shadow-lg flex justify-center items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                保存图片
            </a>
        </div>
    </div>
    <div id="password-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white/90 dark:bg-slate-800/90 backdrop-blur-md rounded-2xl p-6 max-w-sm w-full shadow-2xl border border-pink-100 dark:border-slate-700">
            <p class="text-gray-600 dark:text-gray-300 text-center text-sm mb-6 mt-2">还记得咱俩是什么时候认识的吗</p>
            <input type="text" id="answer-input" class="w-full px-4 py-2.5 border-2 border-patrick-pink/50 rounded-xl mb-4 focus:outline-none focus:ring-2 focus:ring-patrick-pink bg-white/50 text-center" placeholder="在此输入答案...">
            <div class="flex gap-3">
                <button id="cancel-btn" class="flex-1 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl transition-colors text-sm">取消</button>
                <button id="submit-btn" class="flex-1 py-2 bg-patrick-pink hover:bg-pink-400 text-white rounded-xl transition-colors font-bold text-sm">确认</button>
            </div>
            <p id="error-message" class="text-red-500 text-center text-sm mt-3 hidden">不对啊，再给你机会</p>
        </div>
    </div>

    <div id="confirm-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white/90 dark:bg-slate-800/90 backdrop-blur-md rounded-2xl p-6 max-w-sm w-full shadow-2xl border border-pink-100 dark:border-slate-700 text-center">
            <p class="text-gray-700 dark:text-gray-200 font-bold text-lg mb-6 mt-2">其实我不想你看，你确定真的要打开吗</p>
            <div class="flex gap-3">
                <button id="confirm-yes-btn" class="flex-1 py-2 bg-patrick-pink hover:bg-pink-400 text-white rounded-xl transition-colors font-bold text-sm">是</button>
                <button id="confirm-cancel-btn" class="flex-1 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl transition-colors text-sm">否</button>
            </div>
        </div>
    </div>

    <div id="light-mode-content" class="w-full flex-1 flex flex-col justify-between items-center z-20 py-12 px-4 select-none pointer-events-none">
        <h1 class="text-4xl md:text-5xl font-black text-patrick-pink tracking-wider drop-shadow-sm mt-4">
           生日快乐呀 🎉
        </h1>
        <div class="w-full max-w-md bg-white/40 backdrop-blur-md rounded-2xl p-5 border border-white/60 shadow-sm text-center mb-6">
            <p class="text-lg font-bold text-slate-700 mb-1">海绵宝宝和派大星推着大蛋糕来找你啦！</p>
        </div>
    </div>

    <div id="dark-mode-content" class="hidden w-full flex-1 z-20 bg-letter-bg text-gray-200 font-letter relative">
        <div class="container mx-auto px-4 py-16 max-w-2xl min-h-[85vh] flex flex-col justify-between relative">
            <div class="bg-letter-paper rounded-2xl shadow-2xl p-8 md:p-12 border border-slate-700/50 relative flex-1">
                <div class="absolute top-0 left-0 w-full h-3 bg-gradient-to-r from-pink-400 via-purple-400 to-indigo-400 rounded-t-2xl"></div>
                <div class="pt-2">
                    <div id="letter-content-placeholder" class="whitespace-pre-wrap text-base md:text-lg leading-relaxed text-slate-300 min-h-[200px]">
                        稍等
                    </div>
                </div>
            </div>

            <p class="text-center mt-8 text-slate-500 text-xs font-cute">点击右上角的月亮可以返回主页哦</p>

            <a href="https://1816319074.share.123865.com/123pan/6CHqVv-Pvu6H" target="_blank" rel="noopener noreferrer" class="absolute bottom-4 left-6 z-30 group animate-bounce opacity-60 hover:opacity-100 transition-all duration-300" title="🍓">
                <svg class="w-10 h-10 md:w-12 md:h-12 transform group-hover:scale-110 transition-transform duration-300 drop-shadow-lg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M26 18C28 14 31 13 32 13C33 13 36 14 38 18C39 16 41 15 43 15C44 16 44 19 41 21C43 21 46 22 45 24C44 25 40 23 37 22C35 24 33 25 32 25C31 25 29 24 27 22C24 23 20 25 19 24C18 22 21 21 23 21C20 19 20 16 21 15C23 15 25 16 26 18Z" fill="#4ADE80" stroke="#22C55E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M18 25C18 36 24 51 32 53C40 51 46 36 46 25C46 21 41 21 32 21C23 21 18 21 18 25Z" fill="#FB7185" stroke="#F43F5E" stroke-width="2.5" stroke-linejoin="round"/>
                    <circle cx="26" cy="29" r="1.2" fill="#FFE4E6" />
                    <circle cx="38" cy="30" r="1.2" fill="#FFE4E6" />
                    <circle cx="32" cy="34" r="1.2" fill="#FFE4E6" />
                    <circle cx="25" cy="38" r="1.2" fill="#FFE4E6" />
                    <circle cx="39" cy="39" r="1.2" fill="#FFE4E6" />
                    <circle cx="32" cy="44" r="1.2" fill="#FFE4E6" />
                </svg>
            </a>
            </div>
    </div>

    <script>
        const introOverlay = document.getElementById('intro-overlay');
        const giftWrapper = document.getElementById('gift-wrapper');
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const passwordModal = document.getElementById('password-modal');
        const answerInput = document.getElementById('answer-input');
        const submitBtn = document.getElementById('submit-btn');
        const cancelBtn = document.getElementById('cancel-btn');
        const errorMessage = document.getElementById('error-message');
        const confirmModal = document.getElementById('confirm-modal');
        const confirmYesBtn = document.getElementById('confirm-yes-btn');
        const confirmCancelBtn = document.getElementById('confirm-cancel-btn');
        const lightModeContent = document.getElementById('light-mode-content');
        const darkModeContent = document.getElementById('dark-mode-content');
        const bgm = document.getElementById('bgm');
        const patrickTrigger = document.getElementById('patrick-trigger'); 
        const patrickHint = document.getElementById('patrick-hint'); 
        const gradientLayer = document.getElementById('gradient-layer'); 
        
        // 👇 新增：获取图片弹窗的元素 👇
        const cakeTrigger = document.getElementById('cake-trigger');
        const imageModal = document.getElementById('image-modal');
        const closeImageModal = document.getElementById('close-image-modal');
        // 👆 新增结束 👆

        let isMusicPlaying = false;
        const correctAnswers = ['2024115', '20241105', '2024.11.5', '2024.11.05', '2024年11月5日'];

        introOverlay.addEventListener('click', () => {
            giftWrapper.style.display = 'none';
            introOverlay.style.pointerEvents = 'none';
            confetti({ particleCount: 260, spread: 360, startVelocity: 55, origin: { x: 0.5, y: 0.5 }, colors: ['#FF9AA2', '#FFB7B2', '#FFDAC1', '#E2F0CB', '#B5EAD7', '#C7CEEA'] });
            setTimeout(() => { introOverlay.classList.add('opacity-0'); setTimeout(() => { introOverlay.classList.add('hidden'); }, 1000); }, 1500);
        });

        function loadLetterText() {
            const placeholder = document.getElementById('letter-content-placeholder');
            fetch('letter.txt').then(r => r.text()).then(t => { placeholder.innerHTML = t; }).catch(() => { placeholder.innerHTML = "信件加载失败"; });
        }

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');

            if (isDark) {
                themeIcon.innerText = '☽'; 
                lightModeContent.classList.add('hidden');
                darkModeContent.classList.remove('hidden');
                patrickTrigger.classList.add('hidden'); 
                cakeTrigger.classList.add('hidden'); // 切换暗黑模式时隐藏蛋糕热区
                if(patrickHint) patrickHint.classList.add('hidden'); 

                gradientLayer.classList.replace('opacity-100', 'opacity-0');
                document.body.className = "min-h-screen bg-slate-900 transition-all duration-700 font-letter overflow-x-hidden flex flex-col justify-between relative";

                loadLetterText();
            } else {
                themeIcon.innerText = '☼';
                darkModeContent.classList.add('hidden');
                lightModeContent.classList.remove('hidden');
                patrickTrigger.classList.remove('hidden'); 
                cakeTrigger.classList.remove('hidden'); // 切换白天模式时显示蛋糕热区
                if(!isMusicPlaying && patrickHint) patrickHint.classList.remove('hidden'); 

                gradientLayer.classList.replace('opacity-0', 'opacity-100');
                document.body.className = "min-h-screen bg-transparent transition-all duration-700 font-cute overflow-x-hidden flex flex-col justify-between relative";
            }
        }

        patrickTrigger.addEventListener('click', () => {
            if (patrickHint) patrickHint.classList.add('hidden');
            isMusicPlaying ? bgm.pause() : bgm.play();
            isMusicPlaying = !isMusicPlaying;
        });

        // 👇 新增：蛋糕图片的点击交互逻辑 👇
        cakeTrigger.addEventListener('click', () => {
            imageModal.classList.remove('hidden');
        });

        closeImageModal.addEventListener('click', () => {
            imageModal.classList.add('hidden');
        });

        // 点击黑色背景也可以关闭弹窗
        imageModal.addEventListener('click', (e) => {
            if (e.target === imageModal) {
                imageModal.classList.add('hidden');
            }
        });
        // 👆 新增结束 👆

        themeToggle.addEventListener('click', () => {
            if (!document.documentElement.classList.contains('dark')) {
                passwordModal.classList.remove('hidden');
                answerInput.focus();
            } else {
                toggleTheme();
            }
        });

        submitBtn.addEventListener('click', () => {
            if (correctAnswers.includes(answerInput.value.trim())) {
                passwordModal.classList.add('hidden');
                confirmModal.classList.remove('hidden');
            } else {
                errorMessage.classList.remove('hidden');
                answerInput.value = '';
            }
        });

        cancelBtn.addEventListener('click', () => passwordModal.classList.add('hidden'));
        confirmYesBtn.addEventListener('click', () => { confirmModal.classList.add('hidden'); toggleTheme(); });
        confirmCancelBtn.addEventListener('click', () => confirmModal.classList.add('hidden'));
    </script>
</body>
</html>
