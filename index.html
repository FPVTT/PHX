<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生日快乐 🎂</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'patrick-pink': '#FF9AA2',
                        'letter-bg': '#0f172a',
                        'letter-paper': '#1e293b',
                    },
                    fontFamily: {
                        'cute': ['Comic Sans MS', 'cursive', 'sans-serif'],
                        'letter': ['Georgia', 'serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            /* 1. 核心动画：让背景整体律动（派大星、海绵宝宝、蛋糕一起浮动） */
            .animate-character-dance {
                animation: characterDance 6s ease-in-out infinite;
            }
            /* 漂浮装饰元素动效 */
            .animate-bubble-float {
                animation: bubbleFloat 4s ease-in-out infinite;
            }
        }

        @keyframes characterDance {
            0%, 100% { transform: translateY(0px) scale(1) rotate(0deg); }
            33% { transform: translateY(-12px) scale(1.02) rotate(1.5deg); }
            66% { transform: translateY(6px) scale(0.98) rotate(-1.5deg); }
        }

        @keyframes bubbleFloat {
            0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.6; }
            50% { transform: translateY(-20px) translateX(10px); opacity: 0.9; }
        }
    </style>
</head>
<body class="min-h-screen bg-white transition-all duration-700 font-cute overflow-x-hidden flex flex-col justify-between relative">

    <div id="bg-character-layer" class="absolute inset-0 z-0 pointer-events-none bg-contain bg-center bg-no-repeat opacity-95 transition-all duration-700 mix-blend-multiply dark:mix-blend-normal dark:opacity-10 animate-character-dance" style="background-image: url('background.png'); background-position: center 45%;">
        </div>

    <div class="absolute inset-0 z-10 pointer-events-none overflow-hidden select-none">
        <span class="absolute top-[20%] left-[15%] text-3xl animate-bubble-float">💧</span>
        <span class="absolute top-[15%] right-[20%] text-2xl animate-bubble-float" style="animation-delay: 1.5s;">🌟</span>
        <span class="absolute bottom-[30%] left-[25%] text-2xl animate-bubble-float" style="animation-delay: 0.7s;">🎈</span>
        <span class="absolute bottom-[40%] right-[15%] text-3xl animate-bubble-float" style="animation-delay: 2.2s;">✨</span>
    </div>

    <button id="theme-toggle" class="fixed top-6 right-6 z-50 p-2 rounded-full opacity-80 hover:opacity-100 transition-all duration-300">
        <span id="theme-icon" class="text-gray-500 text-2xl font-bold">☼</span>
    </button>

    <div id="password-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white/90 dark:bg-slate-800/90 backdrop-blur-md rounded-2xl p-6 max-w-sm w-full shadow-2xl border border-pink-100 dark:border-slate-700">
            <h3 class="text-xl font-bold text-center mb-2 text-patrick-pink">🔑 解锁秘密信件 ✨</h3>
            <p class="text-gray-600 dark:text-gray-300 text-center text-sm mb-6">今天是什么特别的日子？</p>
            <input 
                type="text" 
                id="answer-input" 
                class="w-full px-4 py-2.5 border-2 border-patrick-pink/50 rounded-xl mb-4 focus:outline-none focus:ring-2 focus:ring-patrick-pink bg-white/50 text-center"
                placeholder="在此输入答案..."
            >
            <div class="flex gap-3">
                <button id="cancel-btn" class="flex-1 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl transition-colors text-sm">取消</button>
                <button id="submit-btn" class="flex-1 py-2 bg-patrick-pink hover:bg-pink-400 text-white rounded-xl transition-colors font-bold text-sm">确认</button>
            </div>
            <p id="error-message" class="text-red-500 text-center text-sm mt-3 hidden">答案不对哦，再想想~</p>
        </div>
    </div>

    <div id="light-mode-content" class="w-full flex-1 flex flex-col justify-between items-center z-20 py-12 px-4 select-none">
        <h1 class="text-4xl md:text-5xl font-black text-patrick-pink tracking-wider drop-shadow-sm mt-4">
            HAPPY BIRTHDAY! 🎉
        </h1>

        <div class="w-full max-w-md bg-white/40 backdrop-blur-md rounded-2xl p-5 border border-white/60 shadow-sm text-center mb-6">
            <p class="text-lg font-bold text-slate-700 mb-1">海绵宝宝和派大星推着大蛋糕来找你啦！</p>
            <p class="text-xs text-slate-400">悄悄告诉你，右上角有个小秘密哦 ~ 👇✨</p>
        </div>
    </div>

    <div id="dark-mode-content" class="hidden w-full flex-1 z-20 bg-letter-bg text-gray-200 font-letter">
        <div class="container mx-auto px-4 py-16 max-w-2xl">
            <div class="bg-letter-paper rounded-2xl shadow-2xl p-8 md:p-12 border border-slate-700/50 relative">
                <div class="absolute top-0 left-0 w-full h-3 bg-gradient-to-r from-pink-400 via-purple-400 to-indigo-400 rounded-t-2xl"></div>
                <div class="absolute top-6 right-6 text-xl opacity-30">💌✨</div>
                
                <div class="pt-2">
                    <h2 class="text-2xl font-bold text-center mb-8 text-pink-300 font-cute tracking-wide">给你的一封信</h2>
                    <div id="letter-content-placeholder" class="whitespace-pre-wrap text-base md:text-lg leading-relaxed text-slate-300 min-h-[200px]">
                        正在悄悄拆开信件中...
                    </div>
                </div>
            </div>
            <p class="text-center mt-8 text-slate-500 text-xs font-cute">点击右上角的月亮可以返回主页哦</p>
        </div>
    </div>

    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const passwordModal = document.getElementById('password-modal');
        const answerInput = document.getElementById('answer-input');
        const submitBtn = document.getElementById('submit-btn');
        const cancelBtn = document.getElementById('cancel-btn');
        const errorMessage = document.getElementById('error-message');
        const lightModeContent = document.getElementById('light-mode-content');
        const darkModeContent = document.getElementById('dark-mode-content');

        const correctAnswers = ['生日快乐', '生日', '你的生日', '我的生日'];

        function loadLetterText() {
            const placeholder = document.getElementById('letter-content-placeholder');
            fetch('letter.txt')
                .then(response => {
                    if (!response.ok) throw new Error('未能在仓库中找到 letter.txt');
                    return response.text();
                })
                .then(text => { placeholder.innerHTML = text; })
                .catch(err => {
                    placeholder.innerHTML = `<p class="text-red-400 text-center">❌ 信件加载失败<br><span class="text-xs text-gray-500">${err.message}</span></p>`;
                });
        }

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            if (document.documentElement.classList.contains('dark')) {
                themeIcon.innerText = '☽'; 
                lightModeContent.classList.add('hidden');
                darkModeContent.classList.remove('hidden');
                document.body.className = "min-h-screen bg-slate-900 transition-all duration-700 font-letter overflow-x-hidden flex flex-col justify-between relative";
                loadLetterText();
            } else {
                themeIcon.innerText = '☼';
                darkModeContent.classList.add('hidden');
                lightModeContent.classList.remove('hidden');
                document.body.className = "min-h-screen bg-white transition-all duration-700 font-cute overflow-x-hidden flex flex-col justify-between relative";
            }
        }
        
        themeToggle.addEventListener('click', () => {
            if (!document.documentElement.classList.contains('dark')) {
                passwordModal.classList.remove('hidden');
                answerInput.focus();
                errorMessage.classList.add('hidden');
            } else {
                toggleTheme();
            }
        });

        submitBtn.addEventListener('click', () => {
            const answer = answerInput.value.trim();
            if (correctAnswers.some(correct => answer.toLowerCase() === correct.toLowerCase())) {
                passwordModal.classList.add('hidden');
                answerInput.value = '';
                toggleTheme();
            } else {
                errorMessage.classList.remove('hidden');
                answerInput.value = '';
                answerInput.focus();
            }
        });

        cancelBtn.addEventListener('click', () => {
            passwordModal.classList.add('hidden');
            answerInput.value = '';
            errorMessage.classList.add('hidden');
        });

        answerInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') submitBtn.click(); });
        passwordModal.addEventListener('click', (e) => { if (e.target === passwordModal) cancelBtn.click(); });
    </script>
</body>
</html>
